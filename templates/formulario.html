
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ListFlow | Novo Produto</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0d17;
            font-family: 'Inter', sans-serif;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .logo {
            font-size: 30px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 35px;
        }

        .logo span {
            color: #8b5cf6;
        }

        .form-card {
            background: #141827;
            border: 1px solid #292e43;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px #00000040;
        }

        .icon {
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #29213f;
            color: #a78bfa;
            font-size: 25px;
            border-radius: 14px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 25px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #858ba1;
            font-size: 13px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: #c3c7d6;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .input-group {
            margin-bottom: 23px;
        }

        input {
            width: 100%;
            padding: 15px;
            background: #0e1120;
            border: 1px solid #30354b;
            border-radius: 10px;
            color: white;
            outline: none;
            font-size: 14px;
            transition: .3s;
        }

        input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px #8b5cf622;
        }

        input::placeholder {
            color: #626980;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 13px;
            margin-top: 30px;
        }

        .submit-btn {
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: white;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: .3s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px #8b5cf655;
        }

        .back-btn {
            text-align: center;
            padding: 14px;
            border: 1px solid #30354b;
            border-radius: 10px;
            color: #a5aabe;
            text-decoration: none;
            font-size: 13px;
            transition: .3s;
        }

        .back-btn:hover {
            background: #202438;
            color: white;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #626980;
            font-size: 12px;
        }

        @media(max-width: 500px) {
            .form-card {
                padding: 25px;
            }
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="logo">
            List<span>Flow.</span>
        </div>

        <div class="form-card">

            <div class="icon">
                +
            </div>

            <h1>Novo produto</h1>

            <p class="subtitle">
                Adicione um novo produto ao seu estoque.
                Preencha as informações abaixo para continuar.
            </p>

            <form action="{{ url_for('produtos.criar') }}" method="POST">

                <div class="input-group">

                    <label for="nome">Nome do produto</label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Ex: Teclado Mecânico"
                        required
                    >

                </div>

                <div class="input-group">

                    <label for="valor">Valor do produto (R$)</label>

                    <input
                        type="number"
                        id="valor"
                        name="valor"
                        placeholder="Ex: 199.90"
                        step="0.01"
                        min="0"
                        required
                    >

                </div>

                <div class="buttons">

                    <button type="submit" class="submit-btn">
                        Cadastrar produto →
                    </button>

                    <a href="{{ url_for('produtos.index') }}" class="back-btn">
                        Voltar ao dashboard
                    </a>

                </div>

            </form>

        </div>

        <footer class="footer">
            © 2026 ListFlow. Todos os direitos reservados.
        </footer>

    </div>

</body>

</html>
